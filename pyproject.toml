[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rentflow"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic>=2.0",
    "openai>=1.30",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: tests that hit the real OpenAI API (deselect with -m 'not live')",
    "slow: tests that are deliberately slow (stress, concurrency)",
    "scenario: curated multi-offer ranking scenario tests",
]
